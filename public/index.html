<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RevTrack</title>
<meta name="theme-color" content="#0E3B2E">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="icon" href="/icono.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<main class="portada">
  <div class="wrap">
    <p class="eyebrow" style="color:var(--mist)" id="fecha"></p>
    <h1 id="evento">—</h1>
    <div id="rings"></div>
    <p class="pie" id="pie"></p>
    <p class="firma">RevTrack · Powered by Revamp</p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/rt.js"></script>
<script>
'use strict';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

fetch('/api/resumen').then(r => r.json()).then(pintar).catch(() => {});
RT.suscribir('lobby', { resumen: pintar });
RT.suscribir('global', { recargar: () => location.reload() });

function pintar(d) {
  document.getElementById('evento').textContent = d.evento.nombre;
  document.getElementById('fecha').textContent = new Date(d.evento.fecha + 'T12:00')
    .toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });

// El programa del día: cada ring con TODAS sus pistas. La que está corriendo se
// muestra abierta, con quién está en pista; las demás en una línea.
const estadoTxt = p => {
  if (p.estado === 'cerrada') return 'terminada';
  if (!p.corridos && !p.enPista) return `${p.total} anotados`;
  return `${p.faltan} en lista`;
};

// Una competencia corre de a una pista por vez. Cuando hay un solo ring —el caso
// normal— el ring ES la competencia, así que no se muestra como un nivel aparte:
// va el nombre del evento y abajo las pistas. El encabezado sólo aparece si de
// verdad hay más de una cancha.
const variosRings = d.rings.length > 1;

document.getElementById('rings').innerHTML = d.rings.map(r => `
  <section class="ring-bloque">
    ${variosRings ? `<h2 class="ring-bloque-nombre">${esc(r.nombre)}</h2>` : ''}
    ${r.pistas.map(p => `
      <a class="ring-card ${p.esActiva ? 'activa' : ''} ${p.estado === 'cerrada' ? 'cerrada' : ''}"
         href="/ring/${encodeURIComponent(r.id)}?pista=${encodeURIComponent(p.id)}">
        <span class="ring-card-tope">
          <span class="ring-card-nombre">${esc(p.nombre)}</span>
          <span class="ring-card-pista">${p.esActiva ? 'en curso' : estadoTxt(p)}</span>
        </span>
        ${p.esActiva ? `
          <span class="ring-card-fila">
            ${p.enPista
              ? `${p.enPista.dorsal ? `<span class="dorsal">${esc(p.enPista.dorsal)}</span>` : ''}
                 <span><span class="ring-card-nombre">${esc(p.enPista.perro)}</span><br>
                 <span class="ring-card-sub">${esc(p.enPista.guia)}</span></span>`
              : `<span class="ring-card-sub">${p.faltan ? 'nadie en pista' : 'pista terminada'}</span>`}
            <span class="ring-card-faltan">${p.faltan}<br>en lista</span>
          </span>` : ''}
      </a>`).join('')}
  </section>`).join('');

document.getElementById('pie').innerHTML = 'Tocá una pista para ver su orden de salida. Si estás en la mesa, entrá por ' +
  d.rings.map(r => `<a href="/mesa/${encodeURIComponent(r.id)}">/mesa/${esc(r.id)}</a>`).join(' o ') +
  '. Se corre de a una pista por vez: la que está en curso queda arriba resaltada.';
}
</script>
</body>
</html>
