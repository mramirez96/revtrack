<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mesa · RevTrack</title>
<meta name="theme-color" content="#0E3B2E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="icon" href="/icono.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body class="mesa">

<header class="tope">
  <div class="wrap">
    <span class="tope-ring" id="ringNombre">Mesa</span>
    <span class="tope-pista" id="pistaNombre"></span>
    <span class="tope-estado"><span class="pulso" id="pulso"></span><span id="frescura">conectando</span></span>
  </div>
</header>

<main class="mesa-main">
  <div class="wrap" id="app">
    <p class="cuenta-sub" style="padding:24px 0">Cargando…</p>
  </div>
</main>

<div class="aviso" id="aviso" role="status" aria-live="polite" hidden></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/mesa.js"></script>
</body>
</html>
